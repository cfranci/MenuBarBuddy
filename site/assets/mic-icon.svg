      <stop offset="0%" stop-color="#34c759" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#34c759" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="micGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7cf0a3"/>
      <stop offset="100%" stop-color="#34c759"/>
